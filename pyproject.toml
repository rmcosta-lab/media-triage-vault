[project]
name = "media-organizer"
version = "0.1.0"
description = "Local, offline media triage and organization tool."
readme = "README_media_triage_vault.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jinja2>=3.1.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.21.0",
    "rawpy>=0.24.0",
    "shapely>=2.0.0",
    "sqlmodel>=0.0.24",
    "typer>=0.15.0",
]

[project.scripts]
media-organizer = "backend.app.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "pytest>=8.4.0",
    "pre-commit>=4.4.0",
]

[tool.uv]
# This machine's TLS interception (corporate proxy/AV) rejects the public CA
# chain; load certificates from the OS trust store instead.
system-certs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Ruff formats Python code fences inside Markdown by default; this project's
# docs (READMEs) are out of scope for automated reformatting.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented pattern is `= typer.Argument(...)` / `= typer.Option(...)`
# as parameter defaults — these calls are immutable declarations, not the
# mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend"]

[[tool.mypy.overrides]]
module = "pillow_heif"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rawpy"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
